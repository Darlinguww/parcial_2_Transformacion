version: 2

models:
  - name: stg_customers
    description: "A staging model for the customers table"
    columns:
      - name: customer_id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "A staging model for the exam_orders table"
    columns:
      - name: order_id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id